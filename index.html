<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="_7Kr-rF1HdYRT4WnrJyFCjI-FQu53KlEKkD_HjtAaVw" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyz AI · AI tools that actually save you time</title>
  <meta name="description" content="Short, no-fluff videos on the AI tools worth using for school, side hustles and creative work. Links, videos and the full list of AI tools I use.">
  <meta property="og:title" content="Keyz AI">
  <meta property="og:description" content="AI tools that actually save you time. Videos, links and my full toolkit.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0b0b10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b10;
      --surface: #15151d;
      --surface-2: #1d1d28;
      --line: #2a2a38;
      --text: #f4f4f7;
      --muted: #9a9aad;
      --accent: #c6ff3d;
      --accent-ink: #0b0b10;
      --pink: #ff4fd8;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(600px 400px at 85% -10%, rgba(255, 79, 216, .18), transparent 70%),
        radial-gradient(600px 400px at 0% 10%, rgba(198, 255, 61, .12), transparent 70%);
      z-index: -1;
    }
    a { color: inherit; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    h1, h2, h3 { font-family: "Space Grotesk", Inter, sans-serif; letter-spacing: -0.02em; margin: 0; }

    /* nav */
    nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 11, 16, .8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    nav .wrap { display: flex; gap: 4px; align-items: center; height: 56px; overflow-x: auto; scrollbar-width: none; }
    nav .wrap::-webkit-scrollbar { display: none; }
    nav .brand { font-family: "Space Grotesk", sans-serif; font-weight: 700; text-decoration: none; margin-right: auto; padding-right: 12px; white-space: nowrap; }
    nav .brand span { color: var(--accent); }
    nav a.tab { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 8px 10px; border-radius: 999px; white-space: nowrap; }
    nav a.tab:hover { color: var(--text); background: var(--surface); }

    /* hero */
    .hero { text-align: center; padding: 48px 0 8px; }
    .avatar {
      width: 104px; height: 104px; border-radius: 50%;
      margin: 0 auto 18px;
      display: grid; place-items: center;
      font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 40px;
      color: var(--accent-ink);
      background: linear-gradient(135deg, var(--accent), var(--pink));
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--line);
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .hero h1 { font-size: clamp(32px, 8vw, 48px); line-height: 1.05; }
    .handle { color: var(--muted); margin-top: 6px; font-size: 15px; }
    .tagline { font-size: 18px; margin: 16px auto 0; max-width: 480px; }
    .tagline mark { background: none; color: var(--accent); }
    .cta-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px; border-radius: 999px;
      font-weight: 600; font-size: 15px; text-decoration: none;
      border: 1px solid var(--line); background: var(--surface);
      transition: transform .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-2px); background: var(--surface-2); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.primary:hover { background: #d4ff6b; }
    .btn svg { width: 18px; height: 18px; }

    /* sections */
    section { padding: 40px 0 8px; scroll-margin-top: 64px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .section-head h2 { font-size: 24px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 14px; }

    /* links */
    .links { display: grid; gap: 10px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--line);
      text-decoration: none; transition: transform .15s ease, border-color .15s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: var(--accent); }
    .link .icon { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-size: 20px; }
    .link .label { font-weight: 600; }
    .link .sub { color: var(--muted); font-size: 13px; }
    .link .arrow { margin-left: auto; color: var(--muted); }
    .link.soon { opacity: .55; pointer-events: none; }

    /* videos */
    .videos { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
    .video { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .thumb {
      position: relative; aspect-ratio: 16 / 9; width: 100%;
      background: var(--surface-2) center / cover no-repeat;
      border: 0; padding: 0; cursor: pointer; display: block; color: var(--text);
    }
    .thumb .play {
      position: absolute; inset: 0; margin: auto; width: 60px; height: 60px; border-radius: 50%;
      background: rgba(0, 0, 0, .65); display: grid; place-items: center;
      transition: transform .15s ease, background .15s ease;
    }
    .thumb:hover .play { transform: scale(1.08); background: var(--pink); }
    .thumb .play::before { content: ""; margin-left: 5px; border-style: solid; border-width: 11px 0 11px 18px; border-color: transparent transparent transparent #fff; }
    .thumb.placeholder { cursor: default; display: grid; place-items: center; background: repeating-linear-gradient(135deg, var(--surface-2) 0 14px, var(--surface) 14px 28px); }
    .thumb.placeholder span { font-family: "Space Grotesk", sans-serif; font-weight: 700; color: var(--muted); }
    .thumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video .meta { padding: 14px 16px 16px; }
    .video h3 { font-size: 17px; line-height: 1.3; }
    .video p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .video .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }

    /* tools */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter {
      font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
      padding: 7px 14px; border-radius: 999px;
      background: var(--surface); color: var(--muted); border: 1px solid var(--line);
    }
    .filter[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .tools-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
    .tool {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--line);
      text-decoration: none; transition: border-color .15s ease;
    }
    .tool:hover { border-color: var(--accent); }
    .tool .logo { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; font-family: "Space Grotesk", sans-serif; font-weight: 700; color: var(--accent-ink); }
    .tool .name { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tool .why { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; }
    .tag.free { background: rgba(198, 255, 61, .15); color: var(--accent); }
    .tag.paid { background: rgba(255, 79, 216, .15); color: var(--pink); }

    /* about */
    .about { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
    .about p { margin: 0 0 12px; }
    .about p:last-child { margin: 0; }

    footer { padding: 48px 0 40px; text-align: center; color: var(--muted); font-size: 13px; }
    footer a { color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <!--
    ============================================================
    EDIT ME: everything on the page comes from the CHANNEL object
    in the <script> at the bottom of this file. Change the text,
    links, videos and tools there; you don't need to touch the HTML.
    ============================================================
  -->
  <nav>
    <div class="wrap">
      <a class="brand" href="#top" id="nav-brand"></a>
      <a class="tab" href="#links">Links</a>
      <a class="tab" href="#videos">Videos</a>
      <a class="tab" href="#tools">AI tools</a>
      <a class="tab" href="#about">About</a>
    </div>
  </nav>

  <main class="wrap" id="top">
    <header class="hero">
      <div class="avatar" id="avatar"></div>
      <h1 id="name"></h1>
      <div class="handle" id="handle"></div>
      <p class="tagline" id="tagline"></p>
      <div class="cta-row">
        <a class="btn primary" id="subscribe" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
          Subscribe on YouTube
        </a>
        <a class="btn" href="#tools">See my AI toolkit</a>
      </div>
    </header>

    <section id="links">
      <div class="section-head"><h2>Links</h2><p>Everywhere I post</p></div>
      <div class="links" id="links-list"></div>
    </section>

    <section id="videos">
      <div class="section-head"><h2>Videos</h2><p>Tap to play here</p></div>
      <div class="videos" id="videos-list"></div>
    </section>

    <section id="tools">
      <div class="section-head"><h2>AI tools I use</h2><p id="tools-count"></p></div>
      <div class="filters" id="filters" role="group" aria-label="Filter tools by category"></div>
      <div class="tools-list" id="tools-list"></div>
    </section>

    <section id="about">
      <div class="section-head"><h2>About the channel</h2></div>
      <div class="about" id="about-text"></div>
    </section>
  </main>

  <footer class="wrap" id="footer"></footer>

  <script>
    // ============================================================
    // EDIT ME. Leave a url as "" to show that link as "coming soon".
    // For videos, paste the YouTube video id (the part after watch?v=).
    // Leave id as "" to show a "coming soon" card.
    // ============================================================
    const CHANNEL = {
      name: "Keyz AI",
      handle: "@keyzai",
      initials: "K",
      avatar: "",                 // optional image url, e.g. "avatar.jpg"
      tagline: "AI tools that <mark>actually save you time</mark>. Short, no-fluff breakdowns for school, side hustles and creative work.",
      youtube: "https://www.youtube.com/@keyzai",

      links: [
        { icon: "▶️", label: "YouTube",   sub: "New videos every week",       url: "https://www.youtube.com/@keyzai" },
        { icon: "🎵", label: "TikTok",    sub: "60-second tool demos",        url: "" },
        { icon: "📸", label: "Instagram", sub: "Reels and tool drops",        url: "" },
        { icon: "𝕏",  label: "X",         sub: "Hot takes on new AI releases", url: "" },
        { icon: "✉️", label: "Newsletter", sub: "One email a week. The 3 best tools I found.", url: "" },
        { icon: "🤝", label: "Work with me", sub: "Sponsorships and collabs",  url: "" }
      ],

      videos: [
        { id: "", title: "5 free AI tools every student should be using", blurb: "Notes, flashcards and research in a fraction of the time.", tools: ["ChatGPT", "NotebookLM", "Perplexity"] },
        { id: "", title: "I made a YouTube Short start to finish with only AI", blurb: "Script, voice, edit and thumbnail. Here's the whole workflow.", tools: ["Claude", "ElevenLabs", "CapCut"] },
        { id: "", title: "ChatGPT vs Claude vs Gemini: which one should you use?", blurb: "Same prompts, side by side, honest results.", tools: ["ChatGPT", "Claude", "Gemini"] },
        { id: "", title: "Build a website in 10 minutes without knowing how to code", blurb: "From blank page to live link with an AI coding tool.", tools: ["Cursor", "Claude"] }
      ],

      // category is used for the filter buttons
      tools: [
        { name: "ChatGPT",    category: "Chat & research", price: "free", why: "Everyday brainstorming, quick answers and first drafts.",          url: "https://chatgpt.com",           color: "#10a37f" },
        { name: "Claude",     category: "Chat & research", price: "free", why: "Long writing, coding help and making sense of big documents.",     url: "https://claude.ai",             color: "#d97757" },
        { name: "Perplexity", category: "Chat & research", price: "free", why: "Research with sources, so you can check what it says.",          url: "https://www.perplexity.ai",     color: "#20b8cd" },
        { name: "NotebookLM", category: "Study",           price: "free", why: "Drop in lecture notes, get summaries, quizzes and a podcast.",   url: "https://notebooklm.google.com", color: "#8ab4f8" },
        { name: "Gemini",     category: "Chat & research", price: "free", why: "Works inside Google Docs, Gmail and Drive.",                       url: "https://gemini.google.com",     color: "#a78bfa" },
        { name: "CapCut",     category: "Video",           price: "free", why: "Auto captions and quick edits for Shorts and TikToks.",           url: "https://www.capcut.com",        color: "#f4f4f7" },
        { name: "Descript",   category: "Video",           price: "paid", why: "Edit video by editing the transcript. Kills filler words.",       url: "https://www.descript.com",      color: "#ffd166" },
        { name: "Runway",     category: "Video",           price: "paid", why: "Text and image to video for B-roll and visual effects.",          url: "https://runwayml.com",          color: "#c6ff3d" },
        { name: "ElevenLabs", category: "Audio",           price: "free", why: "Realistic voiceovers when you don't want to record.",            url: "https://elevenlabs.io",         color: "#e5e5e5" },
        { name: "Midjourney", category: "Images",          price: "paid", why: "The best-looking AI images for thumbnails and art.",             url: "https://www.midjourney.com",    color: "#ff4fd8" },
        { name: "Canva",      category: "Images",          price: "free", why: "Thumbnails and graphics with built-in AI features.",             url: "https://www.canva.com",         color: "#7d5cff" },
        { name: "Cursor",     category: "Build",           price: "free", why: "AI code editor. Build sites and apps by describing them.",       url: "https://www.cursor.com",        color: "#9a9aad" }
      ],

      about: [
        "I test AI tools so you don't have to waste your time (or your money) on the ones that don't deliver.",
        "Every video is short and practical: what the tool does, how to use it today, and whether the free version is enough. Made for students, creators and anyone building something on the side."
      ]
    };

    // ---------- render (no need to edit below) ----------
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    $("nav-brand").innerHTML = esc(CHANNEL.name).replace(/(\S+)$/, "<span>$1</span>");
    $("avatar").innerHTML = CHANNEL.avatar ? `<img src="${esc(CHANNEL.avatar)}" alt="${esc(CHANNEL.name)}">` : esc(CHANNEL.initials);
    $("name").textContent = CHANNEL.name;
    $("handle").textContent = CHANNEL.handle;
    $("tagline").innerHTML = CHANNEL.tagline;
    $("subscribe").href = CHANNEL.youtube + "?sub_confirmation=1";

    $("links-list").innerHTML = CHANNEL.links.map((l) => `
      <a class="link${l.url ? "" : " soon"}" ${l.url ? `href="${esc(l.url)}" target="_blank" rel="noopener"` : `aria-disabled="true"`}>
        <span class="icon" aria-hidden="true">${l.icon}</span>
        <span><span class="label">${esc(l.label)}</span><br><span class="sub">${l.url ? esc(l.sub) : "Coming soon"}</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>`).join("");

    $("videos-list").innerHTML = CHANNEL.videos.map((v) => `
      <article class="video">
        ${v.id
          ? `<button class="thumb" data-id="${esc(v.id)}" aria-label="Play: ${esc(v.title)}" style="background-image:url('https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg')"><span class="play"></span></button>`
          : `<div class="thumb placeholder"><span>Coming soon</span></div>`}
        <div class="meta">
          <h3>${esc(v.title)}</h3>
          <p>${esc(v.blurb)}</p>
          <div class="tools">${(v.tools || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        </div>
      </article>`).join("");

    // Load the YouTube player only when tapped, so the page stays fast.
    $("videos-list").addEventListener("click", (e) => {
      const btn = e.target.closest("button.thumb");
      if (!btn) return;
      btn.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${btn.dataset.id}?autoplay=1&rel=0" title="${btn.getAttribute("aria-label")}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      btn.style.cursor = "default";
    });

    const categories = ["All", ...new Set(CHANNEL.tools.map((t) => t.category))];
    let active = "All";
    function renderTools() {
      const list = CHANNEL.tools.filter((t) => active === "All" || t.category === active);
      $("tools-count").textContent = `${CHANNEL.tools.length} tools I actually use`;
      $("filters").innerHTML = categories.map((c) => `<button class="filter" aria-pressed="${c === active}">${esc(c)}</button>`).join("");
      $("tools-list").innerHTML = list.map((t) => `
        <a class="tool" href="${esc(t.url)}" target="_blank" rel="noopener">
          <span class="logo" style="background:${esc(t.color)}" aria-hidden="true">${esc(t.name[0])}</span>
          <span>
            <span class="name">${esc(t.name)} <span class="tag ${t.price === "paid" ? "paid" : "free"}">${t.price === "paid" ? "Paid" : "Free plan"}</span></span>
            <span class="why">${esc(t.why)}</span>
          </span>
        </a>`).join("");
    }
    $("filters").addEventListener("click", (e) => {
      const b = e.target.closest("button.filter");
      if (!b) return;
      active = b.textContent;
      renderTools();
    });
    renderTools();

    $("about-text").innerHTML = CHANNEL.about.map((p) => `<p>${esc(p)}</p>`).join("");
    $("footer").innerHTML = `© ${new Date().getFullYear()} ${esc(CHANNEL.name)}`;
  </script>
</body>
</html>
